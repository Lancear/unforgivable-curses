name: 'Close stale PRs'
on:
  schedule:
    - cron: "37 10 * * *"

permissions:
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          stale-pr-message: 'This issue is stale because it has been open 30 days with no activity. Remove stale label or comment to avoid this being closed in 7 days.'
          days-before-pr-stale: 0
          days-before-pr-close: 0
          days-before-issue-stale: -1
          days-before-issue-close: -1